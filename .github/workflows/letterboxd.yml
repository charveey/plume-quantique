name: Sync Letterboxd RSS

on:
  schedule:
    - cron: '0 3 * * *' # run daily at 03:00 UTC (adjust if you want)
  workflow_dispatch: {} # manual trigger

permissions:
  contents: write

jobs:
  fetch-letterboxd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dateutil beautifulsoup4

      - name: Ensure output dir exists
        run: |
          mkdir -p _data/letterboxd

      - name: Run letterboxd fetch script
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python scripts/fetch_letterboxd.py

      - name: Commit and push changes if any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/letterboxd/*.json || true
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(letterboxd): update author feeds"
            git push origin HEAD:${{ github.ref_name || github.ref }}
          else
            echo "No changes to commit"
          fi
